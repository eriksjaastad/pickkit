[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickkit"
version = "0.1.0"
description = "A kit for picking the best images from large batches. The only image rewrite is crop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pickkit-intake = "intake_init.intake:main"
pickkit-review = "review_select.review:main"
pickkit-crop = "multi_crop.crop:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
